# These zones belong to this service only. Limit writes separately from normal reads.
limit_req_zone $binary_remote_addr zone=paste_reads:1m rate=10r/s;
map $request_method $paste_write_key {
    default "";
    POST $binary_remote_addr;
    DELETE $binary_remote_addr;
}
limit_req_zone $paste_write_key zone=paste_writes:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name paste.blocksmith.studio;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/blocksmith-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paste.blocksmith.studio;
    ssl_certificate /etc/letsencrypt/live/paste.blocksmith.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paste.blocksmith.studio/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2m;
    client_body_timeout 15s;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Paste URLs, passwords in form bodies, and content never belong in access logs.
    access_log off;

    location / {
        limit_req zone=paste_reads burst=40 nodelay;
        limit_req zone=paste_writes burst=10 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header Server;
    }
}
